version: 2

models:
  - name: int_compensation_aggregated_to_department
    description: "Intermediate employee compensation aggregated to department"
    config:
      unique_key: ['department_code', 'year_type', 'reporting_year']
    columns:
      - name: department_code
        tests:
          - not_null
      - name: year_type
        tests:
          - not_null
      - name: reporting_year
        tests:
          - not_null