version: 2

sources:
  - name: raw
    database: datasf_takehome
    schema: raw
    tables:
      - name: raw_datasf__compensation
        description: "Raw employee compensation from datasf"
        columns:
          - name: "Employee Name"
            quote: true
            tests:
              - not_null
          - name: "Job"
            quote: true
            tests:
              - not_null
          - name: "Year"
            quote: true
            tests:
              - not_null
          - name: "Year Type"
            quote: true
            tests:
              - not_null