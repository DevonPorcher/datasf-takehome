version: 2

models:
  - name: department_compensation
    description: "Department compensation"
    config:
      unique_key: ['department_code', 'year_type', 'reporting_year']
    columns:
      - name: department_code
        tests:
          - not_null
      - name: year_type
        tests:
          - not_null
          - accepted_values:
              values: ['Calendar', 'Fiscal']
      - name: reporting_year
        tests:
          - not_null

  - name: department_head_role_mapping
    description: "Mapping of department codes to their Snowflake department head role names"
    columns:
      - name: role_name
        tests:
          - not_null
          - unique
      - name: department_code
        tests:
          - not_null
          - unique

  - name: employee_compensation
    description: "Employee compensation"
    config:
      unique_key: ['employee_name', 'job_code', 'reporting_year', 'year_type']
    columns:
      - name: employee_name
        tests:
          - not_null
      - name: department_code
        tests:
          - not_null
          - relationships:
              to: ref('department_compensation')
              field: department_code
      - name: year_type
        tests:
          - not_null
          - accepted_values:
              values: ['Calendar', 'Fiscal']
      - name: reporting_year
        tests:
          - not_null