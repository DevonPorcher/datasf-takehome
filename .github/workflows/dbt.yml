name: dbt

on:
  pull_request:
    paths:
      - "dbt/**"
  push:
    branches: [main]
    paths:
      - "dbt/**"

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_SCHEMA: CI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dbt Cloud CLI
        run: |
          curl -fsSL https://github.com/dbt-labs/dbt-cli/releases/download/v0.40.18/dbt_0.40.18_linux_amd64.tar.gz | tar -xz
          sudo mv dbt /usr/local/bin/dbt

      - name: dbt debug
        working-directory: dbt
        run: dbt debug

      - name: dbt build
        working-directory: dbt
        run: dbt build
