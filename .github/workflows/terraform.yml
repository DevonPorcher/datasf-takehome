name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"

env:
  TF_VAR_organization_name: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
  TF_VAR_account_name: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
  TF_VAR_database_name: ${{ secrets.SNOWFLAKE_DATABASE }}
  TF_VAR_schema_name: ${{ secrets.SNOWFLAKE_SCHEMA }}
  TF_VAR_department_table_name: DEPARTMENT_COMPENSATION
  TF_VAR_employee_table_name: EMPLOYEE_COMPENSATION
  TF_VAR_private_key_path: ${{ github.workspace }}/snowflake_tf_key.p8
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_ANALYTICS_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python deps for department-codes data source
        run: pip install snowflake-connector-python python-dotenv

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_TF_PRIVATE_KEY }}" > "$TF_VAR_private_key_path"

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: terraform
        run: terraform init

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      - name: terraform plan
        working-directory: terraform
        run: terraform plan -no-color
